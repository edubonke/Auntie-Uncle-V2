name: Marketplace interface checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check redesign.js
          node --check backend.js
          node --check phase4.js
          node --check phase5.js
          node --check phase5b.js
          node --check supabase-config.js
      - name: Dashboard source contracts
        run: node --test tests/phase3.test.mjs tests/phase4.test.mjs tests/phase5.test.mjs tests/phase5b.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Responsive redesign and interaction tests
        run: python tests/redesign_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redesign-screenshots
          path: ../auntie-v2-*.png
          if-no-files-found: ignore
